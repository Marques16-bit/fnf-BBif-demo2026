name: Build Mobile-Porter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install and Setup Lime
        run: |
          haxelib install lime --quiet
          haxelib run lime setup -y

      - name: Install Haxelibs
        run: |
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons --quiet
          haxelib install tjson --quiet
          haxelib install hxIni --quiet
          haxelib install away3d --quiet
          haxelib install flixel-animate --quiet
          haxelib install hscript-iris --quiet
          haxelib install hxvlc --quiet
          haxelib install hxdiscord_rpc --quiet
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit --quiet

      - name: Configure Lime Android Settings
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Build android
        run: haxelib run lime build android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Porter-android
          path: export/release/android
          if-no-files-found: error
